<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的第一个网页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    line-height: 1.75;
    padding: 48px 20px;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 620px; }
  .tag {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 1px;
    color: #6b6b6b;
    border: 1px solid #ddd;
    border-radius: 999px;
    padding: 3px 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 30px; line-height: 1.3; font-weight: 600; margin-bottom: 12px; }
  .lead { font-size: 16px; color: #555; margin-bottom: 36px; }
  h2 { font-size: 15px; font-weight: 600; margin: 32px 0 12px; color: #333; }
  ul { list-style: none; }
  li {
    padding: 12px 16px;
    background: #fff;
    border: 1px solid #e8e8e4;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 15px;
  }
  li span { color: #999; font-size: 13px; margin-right: 10px; }
  .note {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #e8e8e4;
    font-size: 13px;
    color: #888;
  }
  a { color: #1a1a1a; }
</style>
</head>
<body>
<main>
  <div class="tag">第一个公网页面</div>
  <h1>你好，我是 ___</h1>
  <p class="lead">这句话在 2026 年 11 月被放到了互联网上，现在你在任何一个有网的地方都能看到它。</p>

  <h2>这个月要做完的事</h2>
  <ul>
    <li><span>01</span>把 JDK、IDEA、Git 装好</li>
    <li><span>02</span>学会 add / commit / push 三个动作</li>
    <li><span>03</span>让一个网页在公网上能打开</li>
    <li><span>04</span>发给 3 个同学，等一句回话</li>
  </ul>

  <h2>关于这个页面</h2>
  <p class="lead">它就是一个 HTML 文件。没有服务器，没有数据库，托管在 GitHub Pages 上，免费。</p>

  <p class="note">修改这句占位文字，换成你自己的介绍，然后重新提交一次，刷新本页看看变化。</p>
</main>
</body>
</html>
